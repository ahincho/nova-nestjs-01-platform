name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Una segunda subida a la misma rama cancela la corrida anterior: nadie mira el
# resultado de un commit que ya fue reemplazado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # Los paquetes declaran `engines: ">=24.15"`, que permite la línea 26. Sin
    # esta matriz esa afirmación no estaba probada: se construía, se probaba y
    # se publicaba solo en 24. Ninguno de los 1357 rangos `engines` del árbol
    # excluye 26, pero soporte declarado no es soporte ejercitado.
    #
    # La 25 no está a propósito: es línea impar y sin soporte a largo plazo, y
    # `vitest` 5 la excluye explícitamente (`^22.12 || ^24 || >=26`).
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Este workflow es autocontenido a propósito. La composite action
      # nova-setup-node de nova-devops acepta un input `package-manager` pero su
      # paso de instalación siempre corre npm, así que no sirve para un
      # workspace de pnpm. Migrar a ella cuando soporte pnpm de verdad.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # build, typecheck, cobertura y formato, en ese orden: un paquete consume
      # el dist de su hermano, así que el typecheck no puede ir primero.
      - name: Verify
        run: pnpm verify

      # Verify solo mira el monorepo, donde cada paquete resuelve su propio
      # árbol. Esto instala los tarballs en un servicio de verdad, que es el
      # único lugar donde se ven los peers aplanados.
      - name: Consumer check
        uses: ./.github/actions/consumer-check

      # El ejemplo está escrito a mano, así que no prueba el generador -ni
      # `lint:arch`, que no corre en ningún otro lugar-. Estos dos generan un
      # servicio en limpio y le pasan la puerta de calidad entera.
      # Uno con contexto y otro sin él, a propósito: son dos caminos distintos y
      # entre los dos quedan los dos cubiertos, sin duplicar la construcción de
      # imagen. El ACL lleva el contexto porque es el sabor cuyo feature inyecta
      # por token y puede no arrancar si el módulo queda mal atado.
      - name: Generated ACL check
        uses: ./.github/actions/generated-service-check
        with:
          style: acl
          name: academic-acl
          feature: buildings

      - name: Generated BFF check
        uses: ./.github/actions/generated-service-check
        with:
          style: bff
          name: home-bff
