packages:
  - 'packages/*'

# pnpm 10+ bloquea los scripts de instalación de las dependencias y aborta el
# install si nadie decidió qué hacer con ellos. Decidirlo acá es lo que evita
# que un `pnpm install` limpio falle en CI antes de compilar nada.
#
# `@scarf/scarf` va en false porque su script de instalación es telemetría: le
# reporta al mantenedor que alguien instaló el paquete. Entró al árbol con
# `@nestjs/swagger`, que lo arrastra por `swagger-ui-dist`. Apagarlo no le quita
# nada al paquete: la documentación se sirve igual.
#
# `unrs-resolver` va en false porque no hace falta: es el binario nativo
# opcional del resolutor de imports de ESLint, que cae a su implementación en
# JavaScript cuando no está compilado. @parcel/watcher estaba acá por el modo
# --watch de Jest y salió del árbol junto con él.
#
# Los tres siguientes llegan con testcontainers, que solo usan las pruebas de los
# almacenes de secretos. `ssh2` y `cpu-features` compilan un binario nativo
# para hablar con un Docker remoto por SSH, que las pruebas no usan: sin él, ssh2
# cae a su implementación en JavaScript. El script de `protobufjs` solo avisa
# si la versión instalada es vieja.
allowBuilds:
  '@scarf/scarf': false
  cpu-features: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false

# Lo único que queda compartido por catálogo. Las versiones de las
# herramientas se fueron a las `dependencies` del toolchain, que es donde
# tienen que estar: el toolchain las instala y el comando `nova` las ejecuta,
# así que un paquete de acá ya no las nombra.
#
# `@types/node` sigue declarado en cada paquete porque el `types: ["node"]` del
# tsconfig lo resuelve desde el paquete, y pnpm no expone un transitivo.
catalog:
  '@types/node': ^24.0.0
  rimraf: ^6.0.1

# Un rango de peer que no se cumple deja de ser una advertencia y pasa a
# romper el install. Es el mecanismo que impide que un consumidor termine en
# un NestJS que la plataforma no declara soportar: el aviso se lee cuando ya
# falló algo, el install fallido se lee al instante.
strictPeerDependencies: true
